name: JONARAI offline Paper Engine tests
on:
  push:
    branches: [feature/synthetic-paper-engine]
    paths:
      - 'paper-engine/**'
      - '.github/workflows/jonarai-paper-engine.yml'
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Run offline synthetic tests
        working-directory: paper-engine
        run: npm test
      - name: Run deterministic fixture demo
        working-directory: paper-engine
        run: npm run demo
