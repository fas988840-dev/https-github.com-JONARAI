<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JONARAI</title>
<style>
body { font-family: Tahoma, Arial; background:#0b1220; color:#e8eefc; padding:16px; margin:0; }
.card { background:#121a2b; border:1px solid #24324d; border-radius:12px; padding:14px; margin:10px 0; }
button { padding:12px 18px; border:0; border-radius:8px; margin:4px; cursor:pointer; font-size:15px; }
.run { background:#2f6fed; color:white; }
.resume { background:#18a958; color:white; }
.ok { color:#3dde9d; } .bad { color:#ff6b6b; }
</style>
</head>
<body>
<h2>JONARAI — Paper + Trailing Stop</h2>
<div class="card">
  <button class="run" onclick="run()">تشغيل دورة</button>
  <button class="resume" onclick="resume()">إعادة تفعيل التداول</button>
</div>
<div class="card">
  <div>حالة التداول: <span id="paused">-</span></div>
  <div>صفقة مفتوحة: <span id="pos">-</span></div>
  <div>آخر نتيجة: <span id="last">-</span></div>
</div>
<div class="card" id="tradeBox">لا توجد صفقة مفتوحة</div>
<div class="card"><pre id="log">-</pre></div>
<script>
async function refresh() {
  try {
    const r = await fetch("/status");
    const s = await r.json();
    document.getElementById("paused").textContent = s.trading_paused ? "موقوف" : "نشط";
    document.getElementById("paused").className = s.trading_paused ? "bad" : "ok";
    document.getElementById("pos").textContent = s.open_position ? "نعم" : "لا";
    document.getElementById("last").textContent = s.last_result || "-";
    const p = s.open_position;
    document.getElementById("tradeBox").innerHTML = p
      ? `دخول: ${p.entry} | حالي: ${p.current || p.entry}<br>وقف: ${p.stop} (${p.stop_type}) | ربح: ${p.pnl || 0}%`
      : "لا توجد صفقة مفتوحة";
    document.getElementById("log").textContent = JSON.stringify((s.closed_trades || []).slice(-6), null, 2);
  } catch (e) {
    document.getElementById("paused").textContent = "غير متصل";
  }
}
async function run() { await fetch("/run", {method:"POST"}); refresh(); }
async function resume() { await fetch("/resume", {method:"POST"}); refresh(); }
refresh();
setInterval(refresh, 7000);
</script>
</body>
</html>
