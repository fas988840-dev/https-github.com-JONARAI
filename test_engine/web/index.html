<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JONARAI QA</title><style>body{font-family:system-ui;background:#101827;color:#edf2f7;margin:2rem}main{max-width:900px;margin:auto}.card{background:#1c293b;padding:1rem;border-radius:12px;margin:1rem 0}.muted{color:#a8b5c7}.ok{color:#73dfad}button{padding:.8rem 1.2rem;border:0;border-radius:8px;cursor:pointer}</style><main><h1>JONARAI — مختبر الاختبار</h1><p class="muted">بيانات اصطناعية TESTCO فقط • لا اتصال بمصادر خارجية • لا وسيط • لا تنفيذ</p><section class="card"><h2>حالة التشغيل</h2><p id="status">لم يبدأ الاختبار</p><button onclick="run()">تشغيل فحص الوكلاء الـ80</button></section><section class="card"><h2>النتائج</h2><div id="summary">—</div><ol id="agents"></ol></section></main><script>async function run(){document.getElementById('status').textContent='جارٍ تشغيل الاختبار المحلي...';const r=await fetch('/api/run');const d=await r.json();document.getElementById('status').textContent='اكتمل فحص العقود الاصطناعية';document.getElementById('summary').innerHTML='<b>'+d.agent_count+'</b> وكيل • <b class="ok">'+d.passed+'</b> اجتاز فحص العقد • الوضع: '+d.data_mode;document.getElementById('agents').innerHTML=d.results.map(x=>'<li>'+x.agent_id+' — '+x.status+' <span class="muted">('+x.implementation+')</span></li>').join('')}</script></html>
